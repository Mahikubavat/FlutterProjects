name: plagiarism_checker
description: A prototype PDF lab-assignment plagiarism checker built with Flutter.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  file_picker: ^8.0.0+1
  syncfusion_flutter_pdf: ^26.2.14
  pdfx: ^2.8.0
  flutter_tesseract_ocr: ^0.4.31
  path_provider: ^2.1.5
  http: ^1.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  image: ^4.10.1
  sqflite: ^2.4.1
  shared_preferences: ^2.5.3
  path: ^1.9.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Tesseract OCR language data (required by flutter_tesseract_ocr on Android/iOS)
  assets:
    - assets/tessdata/
    - assets/tessdata_config.json
